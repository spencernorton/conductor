name: CI
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Go build and race tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Media test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -count=1 -timeout=10m ./...
  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: conductor_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CONDUCTOR_INT_TEST: '1'
      CONDUCTOR_TEST_DSN: postgres://postgres:test-only@127.0.0.1:5432/conductor_test?sslmode=disable
      CONDUCTOR_STREAM_TEST_DSN: postgres://postgres:test-only@127.0.0.1:5432/conductor_stream_test?sslmode=disable
      CONDUCTOR_API_TEST_DSN: postgres://postgres:test-only@127.0.0.1:5432/conductor_api_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Media test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Prepare isolated databases
        env:
          PGPASSWORD: test-only
        run: |
          createdb -h 127.0.0.1 -U postgres conductor_stream_test
          createdb -h 127.0.0.1 -U postgres conductor_api_test
      - run: go test -race -p 1 -count=1 -timeout=15m ./internal/store ./internal/stream ./internal/api ./internal/dvr ./internal/epg ./internal/sd ./internal/reconcile
  gpu-image:
    name: GPU container build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build the candidate with source identity
        env:
          BUILD_SOURCE: https://github.com/${{ github.repository }}
        run: |
          COMMIT=$(git rev-parse HEAD)
          BUILD_DATE=$(git show -s --format=%cI HEAD)
          VERSION="v$(tr -d '[:space:]' < VERSION)"
          docker build -f Dockerfile.cuda --build-arg COMMIT="$COMMIT" --build-arg BUILD_DATE="$BUILD_DATE" \
            --label "org.opencontainers.image.source=$BUILD_SOURCE" \
            --label "org.opencontainers.image.revision=$COMMIT" \
            --label "org.opencontainers.image.version=$VERSION" --tag conductor:gpu-ci .
      - name: Start the GPU image and prove tuner video/audio without requiring a GPU
        run: python3 scripts/check_runtime.py --image conductor:gpu-ci --evidence out/gpu-runtime
      - name: Export the exact runtime-qualified image
        env:
          BUILD_SOURCE: https://github.com/${{ github.repository }}
        run: |
          python3 scripts/tested_image.py export --image conductor:gpu-ci \
            --runtime out/gpu-runtime/runtime.json --dir out/tested-gpu \
            --source "$BUILD_SOURCE" --revision "$(git rev-parse HEAD)" --version "v$(tr -d '[:space:]' < VERSION)"
          CANDIDATE_ID=$(docker image inspect conductor:gpu-ci --format '{{.Id}}')
          docker image rm conductor:gpu-ci
          if docker image inspect "$CANDIDATE_ID" >/dev/null 2>&1; then
            echo 'Candidate is still loaded; cannot prove a fresh archive import' >&2
            exit 1
          fi
          LOADED_ID=$(python3 scripts/tested_image.py load --dir out/tested-gpu \
            --source "$BUILD_SOURCE" --revision "$(git rev-parse HEAD)" --version "v$(tr -d '[:space:]' < VERSION)")
          test "$LOADED_ID" = "$CANDIDATE_ID"
          python3 scripts/test_tested_image.py out/tested-gpu
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conductor-tested-gpu
          path: out/tested-gpu/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gpu-runtime-evidence
          path: out/gpu-runtime/
          retention-days: 14
  image:
    name: Public container build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build the candidate with source identity
        env:
          BUILD_SOURCE: https://github.com/${{ github.repository }}
        run: |
          COMMIT=$(git rev-parse HEAD)
          BUILD_DATE=$(git show -s --format=%cI HEAD)
          VERSION="v$(tr -d '[:space:]' < VERSION)"
          docker build -f Dockerfile --build-arg COMMIT="$COMMIT" --build-arg BUILD_DATE="$BUILD_DATE" \
            --label "org.opencontainers.image.source=$BUILD_SOURCE" \
            --label "org.opencontainers.image.revision=$COMMIT" \
            --label "org.opencontainers.image.version=$VERSION" --tag conductor:ci .
      - name: Prove packaged startup, API writes, tuning and restart persistence
        run: python3 scripts/check_runtime.py --image conductor:ci --evidence out/runtime
      - name: Export the exact runtime-qualified image
        env:
          BUILD_SOURCE: https://github.com/${{ github.repository }}
        run: |
          python3 scripts/tested_image.py export --image conductor:ci \
            --runtime out/runtime/runtime.json --dir out/tested-cpu \
            --source "$BUILD_SOURCE" --revision "$(git rev-parse HEAD)" --version "v$(tr -d '[:space:]' < VERSION)"
          CANDIDATE_ID=$(docker image inspect conductor:ci --format '{{.Id}}')
          docker image rm conductor:ci
          if docker image inspect "$CANDIDATE_ID" >/dev/null 2>&1; then
            echo 'Candidate is still loaded; cannot prove a fresh archive import' >&2
            exit 1
          fi
          LOADED_ID=$(python3 scripts/tested_image.py load --dir out/tested-cpu \
            --source "$BUILD_SOURCE" --revision "$(git rev-parse HEAD)" --version "v$(tr -d '[:space:]' < VERSION)")
          test "$LOADED_ID" = "$CANDIDATE_ID"
          python3 scripts/test_tested_image.py out/tested-cpu
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conductor-tested-cpu
          path: out/tested-cpu/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: container-runtime-evidence
          path: out/runtime/
          retention-days: 14
